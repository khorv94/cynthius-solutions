{{ define "main" }}
<section>
  <div class="wrapper">
    {{ partial "breadcrumbs.html" . }}
    <div id="project-hero">
      <div>
      <h2>{{ .Title }}</h2>
      <p>{{ .Description }}</p>
      </div>
     
    </div>
  </div>
  </div>
</section>

<section id="project">
  <div class="wrapper">
    <div id="project-demo">
    <img src="/images/portfolio/macbook.svg" class="project-macbook">

    <div id="project-landing">
    {{ $landingImage := .Resources.Get "./landing.png" }}
      {{ $landingWebP := $landingImage.Resize "900x webp q100" }}

    <img src="{{ $landingWebP.RelPermalink }}" class="landing-image">
    </div>
  

    </div>
  </div>
</section>

<section>
  <div class="wrapper">
    {{ .Content }}
  </div>
</section>


<section>
  {{ partial "cta.html" }}
</section>

{{ end }}
